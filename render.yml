
services:
  - type: web
    name: opusmusic
    runtime: docker
    plan: free
    repo: https://github.com/kurukshethrathepride/OpusMusic-
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: LOGGER_ID
        sync: false
      - key: MONGO_URL
        sync: false
      - key: SESSION
        sync: false
